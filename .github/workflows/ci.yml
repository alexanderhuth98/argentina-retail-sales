name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, tests and structural audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Tests with coverage
        run: pytest --cov=argentina_retail_sales --cov-report=term-missing --cov-report=xml
      - name: Validate Power BI PBIP
        shell: pwsh
        run: ./powerbi/validate_pbip.ps1 -SkipTom
