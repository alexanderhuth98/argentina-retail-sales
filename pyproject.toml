[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "argentina-retail-sales"
version = "1.1.0"
description = "Analisis reproducible de ventas reales, canales y medios de pago del retail argentino."
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Alexander Huth"}]
requires-python = ">=3.11,<3.13"
dependencies = [
    "pandas==3.0.6",
    "requests==2.34.2",
]

[project.urls]
Homepage = "https://alexanderhuth98.github.io/argentina-retail-sales/"
Repository = "https://github.com/alexanderhuth98/argentina-retail-sales"
Documentation = "https://github.com/alexanderhuth98/argentina-retail-sales/tree/main/docs"
Issues = "https://github.com/alexanderhuth98/argentina-retail-sales/issues"
Releases = "https://github.com/alexanderhuth98/argentina-retail-sales/releases"

[project.scripts]
argentina-retail-sales = "argentina_retail_sales.pipeline:main"

[project.optional-dependencies]
dev = [
    "pip-audit==2.10.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
argentina_retail_sales = ["assets/*.js", "assets/fonts/*.ttf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider --strict-markers"

[tool.coverage.run]
branch = true
source = ["argentina_retail_sales"]

[tool.coverage.report]
show_missing = true
fail_under = 80
exclude_also = ["if __name__ == .__main__.:"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
